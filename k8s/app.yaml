apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellochess-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellochess
  template:
    metadata:
      labels:
        app: hellochess
    spec:
      containers:
        - name: app
          image: hellochess:1.0.0
          imagePullPolicy: Never
          env:
            - name: DB_URL
              value: jdbc:postgresql://db:5432/postgres
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              value: root
            - name: SERVER_PORT
              value: "8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hellochess
spec:
  type: NodePort
  selector:
    app: hellochess
  ports:
    - port: 8080
      targetPort: 8080