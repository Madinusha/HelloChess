apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellochess-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellochess
  template:
    metadata:
      labels:
        app: hellochess
    spec:
      containers:
        - name: app
          image: hellochess:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: hellochess-config
            - secretRef:
                name: hellochess-secret
          env:
            - name: SERVER_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hellochess
spec:
  type: NodePort
  selector:
    app: hellochess
  ports:
    - port: 8080
      targetPort: 8080