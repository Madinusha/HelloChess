spring:
  application:
    name: HelloChess
  mvc:
    static-path-pattern: /static/**
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    # properties:
    #   hibernate:
    #     dialect: org.hibernate.dialect.PostgreSQLDialect
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

logging:
  level:
    org:
      madi:
        demo: DEBUG
      springframework:
        session: INFO
        security: INFO
        web: DEBUG
  structured:
    format:
      console: logstash   # или ecs, gelf

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: 8081   # выделенный порт: недоступен извне кластера (нет Service), security-чейн приложения не применяется
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  security:
    remember-me-key: ${REMEMBER_ME_KEY:changeMeInProduction}