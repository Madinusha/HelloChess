apiVersion: v1
kind: Service
metadata:
  name: vlogs-victoria-logs-single-server
  namespace: vms
  labels:
    app: victoria-logs
spec:
  selector:
    app: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: 9428
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vlogs-victoria-logs-single-server
  namespace: vms
  labels:
    app: victoria-logs
spec:
  serviceName: vlogs-victoria-logs-single-server
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.3.2
          args:
            - "-storageDataPath=/vlogs-data"
            - "-retentionPeriod=7d"
          ports:
            - containerPort: 9428
              name: http
          volumeMounts:
            - name: vlogs-data
              mountPath: /vlogs-data
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: vlogs-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi